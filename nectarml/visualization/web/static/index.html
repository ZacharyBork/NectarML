<!DOCTYPE html>
<html>

<head>
    <title>NectarML Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="button-container">
        <button type="button" id="ClearButton"><img src="resource/broom.svg"></button>
    </div>

    <details open id="graph-dropdown">
        <summary id="graph-dropdown-label">Graphs</summary>
        <div id="graph-layout-options" style="text-align: right;">
            <button type="button" id="GraphLayoutRows"><img src="resource/rows.svg"></button>
            <button type="button" id="GraphLayoutTabs"><img src="resource/tabs.svg"></button>
        </div>

        <div id="graph-container"></div>
    </details>

    <details open id="image-dropdown">
        <summary id="image-dropdown-label">Images</summary>
        <div id="image-container"></div>
    </details>

    <div id="pane-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-zoom/2.0.1/chartjs-plugin-zoom.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
